
# Nombre de Pods de l'application
replicaCount: 1

# Image Docker Go-TeKup
image:
  repository: go-tekup
  tag: "1.1"
  pullPolicy: Never

# Paramètres généraux
nameOverride: ""
fullnameOverride: ""

# Configuration ServiceAccount
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

# Configuration du Service
service:
  type: ClusterIP
  port: 3000

# Configuration Ingress
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: go-tekup.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Ressources adaptées à Minikube
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi

# Vérification de santé
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

# Désactivation de l'autoscaling pour Minikube
autoscaling:
  enabled: false

# Configuration applicative
config:
  NODE_ENV: "production"
  APP_URL: "http://go-tekup.local:8080"
  COOKIE_SECURE: "false"
  SEED_DEMO: "false"
  ALLOWED_EMAIL_DOMAINS: "tek-up.de,tek-up.tn"
  REQUIRE_EMAIL_VERIFICATION: "true"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  MAIL_FROM: "CampusConnect <no-reply@campusconnect.local>"

# Secrets existants dans Kubernetes
existingSecret: app-secret

# HTTPRoute désactivé : nous utilisons Ingress NGINX
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules: []
