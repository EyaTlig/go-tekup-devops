
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-tekup
  namespace: go-tekup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-tekup
  template:
    metadata:
      labels:
        app: go-tekup
    spec:
      containers:
        - name: go-tekup
          image: go-tekup:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: go-tekup-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
