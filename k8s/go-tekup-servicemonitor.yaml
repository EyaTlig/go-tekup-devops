apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-tekup
  namespace: go-tekup
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: go-tekup
  namespaceSelector:
    matchNames:
      - go-tekup
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: go-tekup-metrics
          key: token
