apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-tekup-ingress
  namespace: go-tekup
spec:
  ingressClassName: nginx
  rules:
    - host: go-tekup.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-tekup-service
                port:
                  number: 3000
